<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfólio Expositivo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="language-switcher" role="group" aria-label="Seletor de idioma">
        <button id="language-menu-toggle" class="language-pill" type="button" aria-label="Mudar idioma para inglês">
            <span id="language-current-flag" class="language-flag" aria-hidden="true"></span>
            <span id="language-current-label" class="language-label">Português</span>
        </button>
    </div>

    <!-- Conteúdo principal com classe para animação -->
    <div class="overlay" id="main-content">
        <div class="conteudo">
            <h1 class="linha1" data-i18n="index.hero.line1">PORTFÓLIO</h1>
            <h1 class="linha2" data-i18n="index.hero.line2">EXPOSITIVO</h1>
            <p data-i18n="index.hero.author">Por Guilherme Jorge de Araujo</p>
        </div>

        <!-- Botão Avançar atualizado -->
        <a href="introducao.html" class="btn-avancar" aria-label="Avançar para introdução" data-i18n-aria="index.advanceAria">
            <span data-i18n="index.advance">Avançar</span> <span class="seta-icone">→</span>
        </a>

        <a
            class="btn-curriculo"
            data-i18n-href="index.resumeHref"
            data-i18n-download="index.resumeFilename"
            data-i18n-aria="index.resumeTitle"
            data-i18n-title="index.resumeTitle"
        >
            <svg class="icone-download" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <linearGradient id="gradiente-scanner" x1="0" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#7dd3fc" stop-opacity="0" />
                        <stop offset="0.5" stop-color="#fff" />
                        <stop offset="1" stop-color="#c4b5fd" stop-opacity="0" />
                    </linearGradient>
                    <mask id="mascara-download">
                        <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 18v3h14v-3" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                    </mask>
                </defs>
                <path class="download-contorno" d="M12 3v12m0 0 5-5m-5 5-5-5M5 18v3h14v-3" />
                <rect class="download-scan" x="-14" y="0" width="14" height="24" fill="url(#gradiente-scanner)" mask="url(#mascara-download)" />
            </svg>
        </a>
    </div>

    <!-- Script para transição suave -->
    <script>
        document.querySelector('.btn-avancar').addEventListener('click', function (e) {
            e.preventDefault();
            document.documentElement.classList.add('is-changing', 'is-animating');
            document.getElementById('main-content').classList.add('fade-out');
            setTimeout(function () {
                window.location.href = "introducao.html";
            }, 800);
        });
    </script>
    <script src="./portolioUm/i18n.js" defer></script>
</body>

</html>
